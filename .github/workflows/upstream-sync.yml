name: Upstream sync

# Weekly: merge ruvnet/RuView main into a sync branch, re-derive the wire
# contract the Android app depends on, rebuild and test the app, and open (or
# refresh) a pull request into main. Nothing is merged automatically.
# Known RustSec advisories in v2/Cargo.lock are patched in the same PR when a
# semver-compatible fix exists.
#
# The run itself only fails on an internal error. Anything that needs the
# owner (merge conflict, rejected push, PR that cannot be opened) is reported
# in an issue labelled `upstream-sync`, which closes again once a sync PR is
# open.
#
# Pushing upstream changes that touch .github/workflows needs a token with the
# `workflows` permission: add a fine-grained PAT as secret UPSTREAM_SYNC_TOKEN
# (contents, pull requests and workflows: read & write on this repository).
# Without it, or if it lacks a permission, the built-in token is tried next.
on:
  schedule:
    - cron: "47 4 * * 1" # Mondays 04:47 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ruvnet/RuView
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    # Never run in the upstream repository itself.
    if: github.repository != 'ruvnet/RuView'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      BUILTIN_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # The built-in token is used for checkout so an expired personal token
      # cannot break the run; pushes choose their token below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          behind="$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")"
          sha="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"
          {
            echo "behind=$behind"
            echo "sha=$sha"
            echo "short=${sha:0:9}"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream ${UPSTREAM_REPO}@${sha:0:9}: $behind new commit(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream into sync branch
        if: steps.upstream.outputs.behind != '0'
        id: merge
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-ff --no-edit -m "chore: sync ${UPSTREAM_REPO}@${{ steps.upstream.outputs.short }}" "upstream/$UPSTREAM_BRANCH"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### Merge conflict"
              echo
              echo "Upstream cannot be merged automatically. Conflicting paths:"
              # shellcheck disable=SC2016 # literal backticks for Markdown
              git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/'
              echo
              echo "Resolve locally: \`git fetch https://github.com/${UPSTREAM_REPO} ${UPSTREAM_BRANCH} && git merge FETCH_HEAD\`, then open a pull request into \`${BASE}\`."
            } > "$RUNNER_TEMP/attention.md"
            cat "$RUNNER_TEMP/attention.md" >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh app contract
        if: steps.merge.outputs.ok == 'true'
        id: contract
        run: |
          set +e
          python3 android/tools/upstream_contract.py --report "$RUNNER_TEMP/contract.md"
          check=$?
          python3 android/tools/upstream_contract.py --update > /dev/null
          set -e
          echo "severity=$check" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/contract.md" >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet -- android; then
            git add android/upstream-contract.lock.json android/app/src/main/java/com/usee/scanner/core/UpstreamContract.kt
            git commit -m "chore(android): refresh upstream contract for ${UPSTREAM_REPO}@${{ steps.upstream.outputs.short }}"
          fi

      # Upstream's Security Scanning workflow fails on any open RustSec
      # advisory. Apply the semver-compatible fixes here so the sync PR is
      # not blocked by them; advisories without such a fix are listed.
      - name: Patch Rust advisories
        if: steps.merge.outputs.ok == 'true'
        id: advisories
        run: |
          set +e
          echo "none" > "$RUNNER_TEMP/advisories.md"
          if ! cargo install cargo-audit --locked --quiet; then
            echo "::warning::cargo-audit could not be installed; advisories not checked."
            exit 0
          fi
          cargo audit --file v2/Cargo.lock --json > "$RUNNER_TEMP/audit.json" 2>/dev/null
          pkgs="$(jq -r '[.vulnerabilities.list[].package.name] | unique | .[]' "$RUNNER_TEMP/audit.json" 2>/dev/null)"
          [ -n "$pkgs" ] || exit 0
          git submodule update --init --depth 1 --quiet || echo "::warning::some submodules could not be fetched"
          for pkg in $pkgs; do
            (cd v2 && cargo update --quiet -p "$pkg") || echo "::warning::cargo update -p $pkg failed"
          done
          cargo audit --file v2/Cargo.lock --json > "$RUNNER_TEMP/audit-after.json" 2>/dev/null
          {
            echo "Updated: $(echo "$pkgs" | tr '\n' ' ')"
            left="$(jq -r '.vulnerabilities.list[] | "- \(.advisory.id) in \(.package.name) \(.package.version)"' "$RUNNER_TEMP/audit-after.json" 2>/dev/null)"
            [ -z "$left" ] || printf '\nStill open (no compatible fix):\n%s\n' "$left"
          } > "$RUNNER_TEMP/advisories.md"
          cat "$RUNNER_TEMP/advisories.md" >> "$GITHUB_STEP_SUMMARY"
          git submodule deinit --all --force --quiet || true
          if ! git diff --quiet -- v2/Cargo.lock; then
            git add v2/Cargo.lock
            git commit -m "fix(deps): patch RustSec advisories in v2/Cargo.lock"
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.merge.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.merge.outputs.ok == 'true'

      - name: Test and build the app
        if: steps.merge.outputs.ok == 'true'
        id: build
        working-directory: android
        run: |
          if ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The Android app does not build or pass tests against upstream; the sync PR is marked [needs review]."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outputs.ok == 'true'
        with:
          name: usee-apk-upstream-${{ steps.upstream.outputs.short }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Push sync branch
        if: steps.merge.outputs.ok == 'true'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh's credential helper reads GH_TOKEN at push time.
          gh auth setup-git
          for token in "$SYNC_TOKEN" "$BUILTIN_TOKEN"; do
            [ -n "$token" ] || continue
            if GH_TOKEN="$token" git push --force origin "$SYNC_BRANCH"; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          {
            echo "### Push rejected"
            echo
            echo "The sync branch could not be pushed. If upstream changed files under \`.github/workflows\`, the push needs the \`UPSTREAM_SYNC_TOKEN\` secret with the *Workflows: read & write* permission (see the header of \`.github/workflows/upstream-sync.yml\`). Re-run *Actions → Upstream sync* after updating it."
          } > "$RUNNER_TEMP/attention.md"
          cat "$RUNNER_TEMP/attention.md" >> "$GITHUB_STEP_SUMMARY"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Open or refresh pull request
        if: steps.push.outputs.ok == 'true'
        id: pr
        env:
          SEVERITY: ${{ steps.contract.outputs.severity }}
          BUILD_OK: ${{ steps.build.outputs.ok }}
        run: |
          body="$RUNNER_TEMP/body.md"
          case "$SEVERITY" in
            0) verdict="No change to anything the app uses." ;;
            3) verdict="App constants were regenerated automatically." ;;
            *) verdict="**Needs review:** a wire format the app decodes changed." ;;
          esac
          {
            echo "Weekly merge of [${UPSTREAM_REPO}@${{ steps.upstream.outputs.short }}](https://github.com/${UPSTREAM_REPO}/commit/${{ steps.upstream.outputs.sha }}) (${{ steps.upstream.outputs.behind }} new commits)."
            echo
            echo "- App contract: $verdict"
            echo "- App tests, lint and APK build: $([ "$BUILD_OK" = true ] && echo passed || echo '**failed**')"
            echo "- Rust advisories: $(head -n 1 "$RUNNER_TEMP/advisories.md")"
            echo "- Run and APK artifact: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$RUNNER_TEMP/contract.md"
            echo
            echo "Merge with a **merge commit** (not squash) so upstream history stays shared."
          } > "$body"
          title="Weekly upstream sync: ${UPSTREAM_REPO}@${{ steps.upstream.outputs.short }}"
          if [ "$SEVERITY" = 4 ] || [ "$BUILD_OK" != true ]; then
            title="[needs review] $title"
          fi
          for token in "$SYNC_TOKEN" "$BUILTIN_TOKEN"; do
            [ -n "$token" ] || continue
            export GH_TOKEN="$token"
            number="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number' 2>/dev/null)" || continue
            if [ -n "$number" ]; then
              gh pr edit "$number" --title "$title" --body-file "$body" || continue
              url="$(gh pr view "$number" --json url --jq .url)"
            else
              url="$(gh pr create --head "$SYNC_BRANCH" --base "$BASE" --title "$title" --body-file "$body")" || continue
            fi
            echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          {
            echo "### Pull request could not be opened"
            echo
            echo "The sync branch is pushed and ready. Open the pull request with one click:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...${SYNC_BRANCH}?expand=1"
            echo
            echo "To have it opened automatically, give \`UPSTREAM_SYNC_TOKEN\` the *Pull requests: read & write* permission, or enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*."
            echo
            cat "$body"
          } > "$RUNNER_TEMP/attention.md"
          cat "$RUNNER_TEMP/attention.md" >> "$GITHUB_STEP_SUMMARY"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Report to the owner
        if: always() && steps.upstream.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_OK: ${{ steps.pr.outputs.ok }}
        run: |
          title="Upstream sync needs attention"
          open="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ "$PR_OK" = true ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Resolved: the sync pull request for ${UPSTREAM_REPO}@${{ steps.upstream.outputs.short }} is open." || true
            fi
            exit 0
          fi
          note="$RUNNER_TEMP/attention.md"
          [ -s "$note" ] || echo "The sync run stopped before a pull request was opened. Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$note"
          printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$note"
          echo "::warning title=$title::$(head -n 1 "$note")"
          # Issues are disabled in forks by default; a comment on the base
          # branch commit notifies the owner the same way.
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$note" && exit 0
          elif gh label create upstream-sync --color FBCA04 --description "Weekly upstream sync" --force > /dev/null 2>&1 \
              && gh issue create --title "$title" --label upstream-sync --body-file "$note"; then
            exit 0
          fi
          marker="<!-- upstream-sync ${{ steps.upstream.outputs.short }} -->"
          sha="$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/commits/$sha/comments" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
            echo "Already reported on $sha."
            exit 0
          fi
          printf '## %s\n\n' "$title" > "$RUNNER_TEMP/comment.md"
          cat "$note" >> "$RUNNER_TEMP/comment.md"
          printf '\n%s\n' "$marker" >> "$RUNNER_TEMP/comment.md"
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null \
            || echo "::warning::Could not post the report; see the run summary."
