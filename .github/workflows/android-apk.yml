name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "firmware/esp32-csi-node/main/**"
      - "v2/crates/wifi-densepose-sensing-server/src/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "firmware/esp32-csi-node/main/**"
      - "v2/crates/wifi-densepose-sensing-server/src/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails when firmware/server wire formats drift from the app's lock file.
      - name: Upstream contract
        run: |
          python3 android/tools/test_upstream_contract.py
          python3 android/tools/upstream_contract.py

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the committed Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Build release APK
        working-directory: android
        # Unsigned-key fallback: without the USEE_* secrets the APK is signed
        # with the runner's throwaway debug key (testing only).
        env:
          USEE_KEYSTORE_BASE64: ${{ secrets.USEE_KEYSTORE_BASE64 }}
          USEE_KEYSTORE_PASSWORD: ${{ secrets.USEE_KEYSTORE_PASSWORD }}
          USEE_KEY_ALIAS: ${{ secrets.USEE_KEY_ALIAS }}
          USEE_KEY_PASSWORD: ${{ secrets.USEE_KEY_PASSWORD }}
        run: |
          if [ -n "$USEE_KEYSTORE_BASE64" ]; then
            printf '%s' "$USEE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/usee.jks"
            export USEE_KEYSTORE_FILE="$RUNNER_TEMP/usee.jks"
          fi
          unset USEE_KEYSTORE_BASE64
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usee-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: usee-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
