# cargo-audit configuration read by `cargo audit --file v2/Cargo.lock` from
# the repository root (Security Scanning → Rust Dependency Audit). The v2
# workspace keeps its own list in v2/.cargo/audit.toml.
#
# Only advisories without a semver-compatible fix belong here; anything an
# in-range `cargo update` fixes is patched by the weekly upstream sync. Each
# entry states why the vulnerable code is not reachable. Remove an entry once
# the lockfile no longer contains an affected version.

[advisories]
ignore = [
    # zip < 9.0 — RUSTSEC-2026-0367 (SUID/SGID bits kept on extraction),
    # RUSTSEC-2026-0368 (symlink targets on extraction),
    # RUSTSEC-2026-0369 (Unix permissions applied on extraction).
    # All three concern ZipArchive::extract / ZipStreamReader::extract writing
    # an archive to the filesystem. The fix is zip 9, a breaking release that
    # none of the dependents below support yet:
    #   - candle-core 0.4.1 / 0.9.2 and ndarray-npy 0.10: read .npz/.safetensors
    #     entries in memory and never call extract().
    #   - torch-sys 0.24 (optional `tch-backend` feature of wifi-densepose-nn):
    #     extracts the libtorch archive it downloads from download.pytorch.org
    #     at build time, only when LIBTORCH is unset. No runtime input reaches it.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
